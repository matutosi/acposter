name: build-poster-pdf cross-platform test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows が主戦場なのに CI に無く，$IsWindows の分岐が未検証だった
        # (2026-09-02 に足した)．runner に UD デジタル教科書体は入っていないので，
        # 「埋め込まれていない」の警告は出るが，止まりはしない．
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Show pwsh / browser info
        shell: pwsh
        run: |
          pwsh -Version
          Write-Host "IsWindows=$IsWindows IsMacOS=$IsMacOS IsLinux=$IsLinux"

      # poster.lua の単体テスト．Chrome も画像も要らないので数秒で終わる．
      # 見本のビルドより先に置く (壊れていればここで分かる)．
      - name: Run poster.lua unit tests
        shell: pwsh
        run: pwsh -File tests/run_lua_tests.ps1

      # 異常系．**壊れた md で必ず非0で終わる**ことを見る (エラーを握り潰していないか)．
      # 見本は4本に揃える約束なので，md はここで作って RUNNER_TEMP に置く．
      - name: Fail on a broken poster (error paths)
        shell: pwsh
        run: |
          $md  = Join-Path $env:RUNNER_TEMP 'broken.md'
          $pdf = Join-Path $env:RUNNER_TEMP 'broken.pdf'
          $log = Join-Path $env:RUNNER_TEMP 'broken.log'
          Set-Content -LiteralPath $md -Encoding UTF8 -Value @(
            '---', 'title: "Broken"', 'type: "学術ポスター"',
            'grid:', '  columns: 2', '  boxes:',
            '    - {name: NoSuchHeading, x: 0, y: 0}',
            '---', '', '# One', '', 'a')
          # 出力は**必ずファイルへ逃がす**．2>&1 で受けると，捕まえたエラー行を
          # 表示した時点でこの手順自体が失敗する (Actions の pwsh は
          # $ErrorActionPreference = 'Stop'．2026-09-02 に踏んだ)．
          pwsh -File .claude/skills/build-poster-pdf/make_poster_pdf.ps1 -Md $md -Pdf $pdf *> $log
          $code = $LASTEXITCODE
          if ($code -eq 0)    { Get-Content $log | ForEach-Object { Write-Host $_ }; throw '壊れた md なのに成功で終わった' }
          if (Test-Path $pdf) { throw '壊れた md なのに PDF ができた' }
          Write-Host "期待どおりエラーで止まった (exit $code):"
          Get-Content $log -Tail 3 | ForEach-Object { Write-Host $_ }
          # Actions の pwsh の手順は末尾で `exit $LASTEXITCODE` される．
          # ここまで来たら成功なので，残っている 1 を持ち越さない．
          exit 0

      - name: Build poster_howto example
        shell: pwsh
        run: |
          pwsh -File .claude/skills/build-poster-pdf/make_poster_pdf.ps1 `
            -Md examples/poster_howto.md -Pdf $env:RUNNER_TEMP/poster_howto.pdf -KeepHtml

      - name: Build poster_howto2 example
        shell: pwsh
        run: |
          pwsh -File .claude/skills/build-poster-pdf/make_poster_pdf.ps1 `
            -Md examples/poster_howto2.md -FontSize 26pt -Pdf $env:RUNNER_TEMP/poster_howto2.pdf -KeepHtml

      - name: Build poster_howto3 example
        shell: pwsh
        run: |
          pwsh -File .claude/skills/build-poster-pdf/make_poster_pdf.ps1 `
            -Md examples/poster_howto3.md -FontSize 26pt -Pdf $env:RUNNER_TEMP/poster_howto3.pdf -KeepHtml

      - name: Build golf_course example
        shell: pwsh
        run: |
          pwsh -File .claude/skills/build-poster-pdf/make_poster_pdf.ps1 `
            -Md examples/golf_course.md -FontSize 26pt -Pdf $env:RUNNER_TEMP/golf_course.pdf -KeepHtml

      # ページ数・箱数・フォント名の検算は「形」しか見ておらず，PDF の中身が
      # 別物 (例: file:// URL が壊れて Chrome の新規タブページが印刷される) でも
      # 検出できなかった実例がある (2026-08-29)．pdftotext で実際のテキストを
      # 抜き出し，見本ごとの既知の文字列が入っているかを機械的に確かめる．
      # Windows の runner には apt も brew も無いので，ここだけ Mac/Linux で回す
      # (Windows でも見本4本は組んでおり，ページ数・箱数・フォントの検算は通る)．
      - name: Verify PDF content (not just page/box count)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          if ! command -v pdftotext >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install poppler
            else
              sudo apt-get update -y && sudo apt-get install -y poppler-utils
            fi
          fi
          check() {
            local pdf="$1" needle="$2"
            if ! pdftotext "$pdf" - | grep -qF "$needle"; then
              echo "::error::$pdf に期待した文字列が無い: $needle (file:// URL が壊れて別ページが印刷されていないか確かめる)"
              exit 1
            fi
            echo "OK: $pdf に '$needle' を確認"
          }
          check "$RUNNER_TEMP/poster_howto.pdf" "How to Make an Academic Poster"
          check "$RUNNER_TEMP/poster_howto2.pdf" "input to output"
          check "$RUNNER_TEMP/poster_howto3.pdf" "irregular layouts"
          check "$RUNNER_TEMP/golf_course.pdf" "grassland species richness"

      # -KeepHtml は md と同じ場所 (examples/) に <基幹名>.tmp.html を残す仕様なので，
      # PDF (runner.temp) と一緒にダウンロードできるよう1か所に集める．
      - name: Collect intermediate HTML
        shell: pwsh
        run: Copy-Item examples/*.tmp.html $env:RUNNER_TEMP/

      - name: Upload generated PDFs and HTML
        uses: actions/upload-artifact@v4
        with:
          name: posters-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/*.pdf
            ${{ runner.temp }}/*.tmp.html
